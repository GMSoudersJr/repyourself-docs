    android_text: Workout skipped. Advanced to Week %1$d, Day %2$d
    ios_key: DashboardView.SkipNote
    ios_text: Workout skipped by user.
    note: Possibly not comparable concepts — Android's is a user-facing snackbar naming the new week/day;
      iOS's SkipNote may just be an internal note field, not a shown toast. Verify before treating as
      a wording mismatch.
  program_reset:
    status: android_only
    android_key: feedback_program_reset
    android_text: Program has been reset.
  program_reset_error:
    status: android_only
    android_key: feedback_program_reset_error
    android_text: 'Error: Could not reset program.'
  workout_saved_generic:
    status: fixed
    android_key: feedback_workout_saved_generic
    android_text: Workout Saved
    ios_key: WorkoutDayView.WorkoutSaved
    ios_text: Workout Saved
    note: Unified 2026-08-29 — was 'Workout saved.' (lowercase, trailing period).
  workout_saved_partial_generic:
    status: ios_only
    ios_key: WorkoutDayView.WorkoutSavedPartial
    text: Workout Saved (Partial)
  workout_saved_day_specific:
    status: android_only
    note: 'CONTENT-RICHNESS GAP (verified against actual call sites, not just strings.xml): Android actively
      uses ~11 specific save-confirmation strings surfacing the actual stat achieved — feedback_workout_saved_day1_detail=''Day
      1 saved! Your new max is %1$s.'' (+ day1_shortened), feedback_workout_saved_day2_detail=''Day 2
      saved! You peaked at %1$s.'' (+ day2_shortened), feedback_workout_saved_day3_perfect/_good_effort/_partial
      (no plain day3_detail — Day 3 branches three ways), feedback_workout_saved_day4_detail=''Day 4 saved!
      You completed %1$s.'' (+ day4_shortened), plus feedback_workout_saved_repeat/_repeat_shortened and
      a feedback_workout_saved_generic fallback. iOS only has two generic strings regardless of day or
      performance: WorkoutDayView.WorkoutSaved (''Workout Saved'') and WorkoutSavedPartial (''Workout
      Saved (Partial)''). This is a real feature/content gap, not a simple wording mismatch — worth a
      follow-up decision on whether iOS should adopt Android''s richer, stat-specific confirmations. (Note:
      the plain, no-suffix feedback_workout_saved_day1/day2/day3/day4 keys were separately dead code —
      removed from strings.xml 2026-08-29, see gaps/android.md.)'
