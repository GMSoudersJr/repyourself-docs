  note: PullUpGrip.* (Close, Neutral, Other, Pronated, Supinated, Wide) are grip-name labels. Verify whether
    Android exposes these same names as string resources somewhere not captured by this scan, or hardcodes
    them in Kotlin — if hardcoded, that's the same 'no hardcoded strings' gap flagged for Android's own
    SettingsScreen/DashboardScreen/OnboardingScreen literals.
ios_only_theme_labels:
  note: ThemePreference.Dark/Light/System — verify where Android's equivalent theme-option labels live;
    not found in this strings.xml scan, so they may be hardcoded in Kotlin (SettingsScreen.kt) rather
    than resourced.
