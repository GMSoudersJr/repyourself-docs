  note: ImportCoordinator.* (WarningCountLabel, SaveFailedError, etc.), LegacyPwaMigrator.*, AndroidNativeMigrator.Day3GripParseWarning,
    RepYourselfNativeMigrator.MissingProfileWarning are internal import-validation messages tied to iOS's
    broader import feature (see import_file_dialog.reminder note on the Migrate→Import scope gap). No
    Android equivalents catalogued since Android's import path doesn't handle native-format backups.
