# Rep Yourself — Wording Source of Truth
#
# Canonical reference for user-facing text shared in concept between the
# Android (strings.xml) and iOS (Localizable.xcstrings) apps. This is NOT a
# build input for either app — it is a human-maintained map for keeping
# wording consistent and for future translation work. When wording changes
# in either strings.xml or Localizable.xcstrings, update the matching entry
# here too.
#
# status values:
#   match         - text is already identical (format placeholders aside)
#   match_wording - words match; only letter-casing differs (left alone —
#                   casing is treated as platform visual style, not wording)
#   fixed         - was a genuine mismatch, unified 2026-08-29 (see note)
#   diverges      - a real difference exists and was NOT changed this pass;
#                   see note for why (structural UX difference, uncertain
#                   pairing, or flagged for a future decision)
#   android_only  - concept/string only exists on Android
#   ios_only      - concept/string only exists on iOS
#
# See gaps/android.md and gaps/ios.md for cross-platform feature gaps
# surfaced during this audit that go beyond wording (e.g. Android's richer
# per-day save messages, or iOS's dead ContentView.swift).
#
# CAVEAT: "android_only" / "ios_only" / "diverges" here mean "present in
# strings.xml / Localizable.xcstrings" — NOT necessarily "shown to users."
# Android's strings.xml in particular has real accumulated cruft: several
# entries this audit assumed were live UI turned out to be unreferenced by
# any .kt file once actually grepped (each such case is called out with a
# "DEAD STRING" note where found). Every android_only/diverges/ios_only entry
# was spot-checked for obvious problems but not exhaustively grep-verified
# for live usage — treat this as a solid first-pass map to refine over time,
# not a fully-audited ground truth for every single row.

app:
  name:
    status: diverges
    android_key: app_name
    android_text: Rep Yourself
    note: iOS app name lives in Info.plist (CFBundleDisplayName), not the String Catalog; DashboardView.Title
      uses the same text as an in-app header.
onboarding:
  title:
    status: match
    android_key: onboarding_title
    ios_key: OnboardingView.Title
    text: Ready to Begin?
  body:
    status: fixed
    android_key: onboarding_body
    ios_key: OnboardingView.Body
    text: Start the Armstrong Pull-up Program. Your progress is tracked and saved right here on your device.
    note: Unified 2026-08-29 on iOS's phrasing. Android previously said 'Your progress will be automatically
      tracked and saved on this device.'
  start_new_program_button:
    status: match_wording
    android_key: onboarding_start_new_button
    android_text: START NEW PROGRAM
    ios_key: OnboardingView.StartNewProgramButton
    ios_text: Start New Program
    note: Words match; casing intentionally left as platform style (Android ALL CAPS, iOS Title Case)
      — not treated as a wording mismatch.
  import_button:
    status: fixed
    android_key: onboarding_restore_or_migrate
    ios_key: OnboardingView.ImportButton
    text: Import Previous Data
    note: 'Unified 2026-08-29. This is the actual rendered onboarding button (OnboardingScreen.kt:389);
      it previously said ''Restore or Migrate Data''. CORRECTION: the original audit assumed the visible
      button was android_key `onboarding_restore_button` (''Migrate from PWA''), but that resource was
      dead code — verified via grep that it was never referenced in any .kt file. Removed from strings.xml
      2026-08-29 (see gaps/android.md).'
  import_icon_description:
    status: android_only
    android_key: migrate_data_icon_content_description
    android_text: Import data
    note: Renamed from 'Migrate data' for terminology consistency; no iOS counterpart string found.
import_file_dialog:
  title:
    status: fixed
    android_key: migrate_dialog_title
    android_text: Find Your File
    ios_key: OnboardingView.ImportInstructionsTitle
    ios_text: Find Your File
    note: Unified 2026-08-29 — was 'How to Find Your File'.
  step1:
    status: android_only
    android_key: migrate_dialog_step1
    android_text: When your phone's file browser opens…
    note: Android presents 3 numbered steps; iOS shows one consolidated paragraph (ImportInstructionsBody)
      plus per-source caption cards — a structural UX difference, not just wording. Not reconciled.
  step2:
    status: android_only
    android_key: migrate_dialog_step2
    android_text: Look for and open the "Downloads" folder.
  step3:
    status: diverges
    android_key: migrate_dialog_step3_new
    android_text: 'Select your backup file:'
    ios_key: OnboardingView.ImportInstructionsBody
    ios_text: If you've exported your data from the web app, or backed it up from Rep Yourself on iOS
      or Android (Settings → Export Data), open the Files app and look for the exported file there — it's
      usually in Downloads or on iCloud Drive.
    note: Same structural-difference note as step1/step2.
  native_filename_caption:
    status: diverges
    android_key: migrate_dialog_native_filename
    android_text: RepYourself_Export.json
    ios_key: OnboardingView.ImportInstructionsNativeCaption
    ios_text: From Rep Yourself on iOS or Android
    note: 'BUG FIXED 2026-08-29: Android''s string literally said ''Repyourself_Export.json'' (lowercase
      y) — confirmed via grep that the real generated filename in SettingsScreen.kt is ''RepYourself_Export.json''.
      Corrected the typo. Android shows the literal filename; iOS shows a source caption instead of a
      filename — structural difference kept as-is.'
  ios_filename_caption:
    status: diverges
    android_key: migrate_dialog_ios_filename
    android_text: RepYourself_Export.json (from iPhone)
    note: Android additionally calls out an iPhone-specific filename case; iOS's caption cards don't need
      this distinction since the app already knows which platform it's running on.
  pwa_filename_caption:
    status: diverges
    android_key: migrate_dialog_pwa_filename
    android_text: Pull-Up-App-Backup.json
    ios_key: OnboardingView.ImportInstructionsWebCaption
    ios_text: From the web app
    note: Same structural difference (literal filename vs. source caption).
  reminder:
    status: fixed
    android_key: migrate_dialog_reminder
    android_text: If you haven't exported this file yet — from Settings on your other Rep Yourself app
      or the web app — please do so first.
    ios_key: OnboardingView.ImportInstructionsReminder
    ios_text: Haven't exported your data yet? Use Export Data in Settings on your other device (or the
      web app), then come back here.
    note: 'Unified 2026-08-29. CORRECTION: an earlier draft of this audit assumed Android''s import only
      supported PWA exports, based on the reminder text alone — that was wrong. gaps/android.md''s now-Resolved
      ''add-ios-native-import'' entry (PR #51) shows Android''s OnboardingViewModel.performMigration()
      already tries PWA then IosNativeExport formats, and migrate_dialog_native_filename/migrate_dialog_ios_filename
      already list all 3 source filenames (Android/iOS/web) — only the reminder sentence''s wording hadn''t
      caught up to say so. Reworded to mention ''your other Rep Yourself app'' alongside the web app,
      matching the capability that already exists. Not fully identical to iOS''s phrasing (Android''s
      stays close to its own dialog''s step-by-step voice).'
  confirm_button:
    status: fixed
    android_key: migrate_dialog_confirm_button
    android_text: Continue
    ios_key: OnboardingView.ImportInstructionsConfirmButton
    ios_text: Continue
    note: Unified 2026-08-29 — was 'Got It, Open Files'.
  cancel_button:
    status: ios_only
    ios_key: OnboardingView.ImportInstructionsCancelButton
    text: Cancel
  or_divider:
    status: android_only
    android_key: migrate_dialog_or
    android_text: OR
  step_number_format:
    status: android_only
    android_key: migrate_dialog_step_number
    android_text: '%1$d.'
    note: ADDED 2026-08-29 — replaces literal '1.'/'2.'/'3.' Text() calls previously hardcoded in OnboardingScreen.kt
      (a wording-audit finding). No iOS equivalent needed; iOS doesn't number its consolidated import
      instructions.
  file_picker_error:
    status: diverges
    ios_key: OnboardingView.FilePickerErrorTemplate
    ios_text: 'Couldn''t open file picker: %@'
    note: No Android equivalent found for a file-picker-launch-failure message specifically.
