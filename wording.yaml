    and equivalents for Pyramid/TrainingSetsGrips/TrainingSetsMax/Repeat — plus RepsSuffixKnown/RepsSuffixUnknown.
    This looks like a program-detail/about screen or data model iOS built that Android may express purely
    in code/UI rather than as string resources. Not catalogued 1:1 here; worth a closer look if this content
    should exist on Android too.
